<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>again — know what to cook next</title>
<meta name="description" content="Remember what your household actually liked and always know what to cook next.">
<meta name="theme-color" content="#F8F7F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151A19" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="again">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap">

<style>
/* ================================================================
   TOKENS — minimalist editorial, 8px spacing system
   ================================================================ */
:root {
  --teal:        #244F52;
  --teal-deep:   #1B3D40;
  --ink:         #1E2424;
  --muted:       #747C7C;
  --bg:          #F8F7F3;
  --card:        #FFFFFF;
  --border:      #E4E5E1;
  --selected:    #E6EFEF;
  --positive:    #7C9A83;
  --positive-soft: #EDF2EE;
  --danger:      #A05744;
  --danger-soft: #F4E9E5;

  --font-brand: "Cormorant Garamond", "Playfair Display", Georgia, serif;
  --font-ui: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

  --r-sm: 8px;
  --r-md: 12px;
  --s1: 8px;  --s2: 16px;  --s3: 24px;  --s4: 32px;

  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);

  --shadow: 0 1px 2px rgba(30, 36, 36, .05);
}

@media (prefers-color-scheme: dark) {
  :root {
    --teal:      #8FB8BA;
    --teal-deep: #A8CBCC;
    --ink:       #E8EAE7;
    --muted:     #8B938F;
    --bg:        #151A19;
    --card:      #1D2322;
    --border:    #2B3230;
    --selected:  #223634;
    --positive:  #93AF9A;
    --positive-soft: #1F2B23;
    --danger:    #C88972;
    --danger-soft: #33231D;
    --shadow: none;
  }
}

/* ================================================================ BASE */

* { box-sizing: border-box; }
html, body { height: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

button { font-family: var(--font-ui); color: inherit; }
::selection { background: var(--selected); }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; border-radius: 4px; }

.brand {
  font-family: var(--font-brand);
  font-weight: 500;
  letter-spacing: -.02em;
  text-transform: lowercase;
}

/* ================================================================ SHELL */

.app { min-height: 100dvh; display: flex; flex-direction: column; max-width: 1120px; margin: 0 auto; }

.topnav {
  display: none; align-items: center; gap: var(--s3);
  padding: 14px var(--s4);
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  position: sticky; top: 0; z-index: 40;
}
.topnav .brand { font-size: 28px; color: var(--ink); text-decoration: none; margin-right: var(--s2); }
.topnav button {
  background: none; border: none; cursor: pointer;
  font-size: 13.5px; font-weight: 500; color: var(--muted);
  padding: 6px 2px; border-bottom: 2px solid transparent; border-radius: 0;
  transition: color .15s;
}
.topnav button[aria-selected="true"] { color: var(--teal); border-bottom-color: var(--teal); }
.topnav button:hover { color: var(--ink); }

.appbar {
  display: flex; align-items: center; justify-content: space-between; gap: var(--s2);
  padding: calc(12px + var(--sat)) var(--s2) 10px;
  position: sticky; top: 0; z-index: 40;
  background: color-mix(in srgb, var(--bg) 94%, transparent);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.appbar .brand { font-size: 27px; line-height: 1; }
.appbar .meta { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

.screens { flex: 1; display: flex; flex-direction: column; }
.screen { flex: 1; padding-bottom: calc(88px + var(--sab)); }
.screen[hidden] { display: none; }

.pagepad { padding-left: var(--s2); padding-right: var(--s2); }

@media (min-width: 800px) {
  .topnav { display: flex; }
  .appbar, .bottomnav { display: none; }
  .screen { padding-bottom: var(--s4); max-width: 664px; margin: 0 auto; width: 100%; }
  .pagepad { padding-left: 0; padding-right: 0; }
  .screens { padding: var(--s3) var(--s4); }
}

/* ================================================================ NAV */

.bottomnav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
  display: grid; grid-template-columns: 1fr 1fr auto 1fr 1fr;
  align-items: end;
  background: color-mix(in srgb, var(--card) 97%, transparent);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--border);
  padding: 6px 6px calc(6px + var(--sab));
}

.bottomnav .navbtn {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  background: none; border: none; cursor: pointer;
  padding: 6px 2px; color: var(--muted);
  font-size: 10.5px; font-weight: 500;
  border-radius: var(--r-sm);
  transition: color .15s;
}
.bottomnav .navbtn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.bottomnav .navbtn[aria-selected="true"] { color: var(--teal); }

.bottomnav .logbtn {
  width: 52px; height: 52px; margin: 0 10px 8px;
  border-radius: 50%;
  background: var(--teal);
  border: none; cursor: pointer;
  display: grid; place-items: center;
  box-shadow: var(--shadow);
  transition: transform .15s, opacity .15s;
}
.bottomnav .logbtn svg { width: 24px; height: 24px; stroke: #fff; stroke-width: 2; stroke-linecap: round; }
.bottomnav .logbtn:active { transform: scale(.94); }
@media (prefers-color-scheme: dark) { .bottomnav .logbtn svg { stroke: #10201E; } }
@media (min-width: 800px) { .bottomnav { display: none; } }

/* ================================================================ COMPONENTS */

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  font-size: 14px; font-weight: 500;
  padding: 10px 18px;
  border-radius: 10px;
  border: 1px solid transparent;
  cursor: pointer;
  transition: background .15s, color .15s, border-color .15s, opacity .15s;
  text-decoration: none;
}
.btn:active { opacity: .82; }
.btn:disabled { opacity: .4; cursor: default; }
.btn-primary { background: var(--teal); color: #fff; }
@media (prefers-color-scheme: dark) { .btn-primary { color: #10201E; } }
.btn-primary:hover { background: var(--teal-deep); }
.btn-secondary { background: var(--card); color: var(--ink); border-color: var(--border); }
.btn-secondary:hover { border-color: var(--muted); }
.btn-quiet { background: none; color: var(--muted); }
.btn-quiet:hover { color: var(--ink); }
.btn-block { width: 100%; }
.btn-sm { padding: 7px 13px; font-size: 13px; border-radius: var(--r-sm); }

.chiprow { display: flex; gap: var(--s1); overflow-x: auto; scrollbar-width: none; padding: var(--s2) var(--s2) var(--s1); }
.chiprow::-webkit-scrollbar { display: none; }
@media (min-width: 800px) { .chiprow { padding-left: 0; padding-right: 0; flex-wrap: wrap; } }

.chip {
  font-size: 12.5px; font-weight: 500;
  padding: 6px 13px;
  border-radius: 100px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--muted);
  cursor: pointer;
  white-space: nowrap;
  transition: background .15s, color .15s, border-color .15s;
}
.chip:hover { color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--selected); border-color: var(--selected); color: var(--teal); font-weight: 600; }

.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--r-md); box-shadow: var(--shadow); }

.tile {
  display: grid; place-items: center;
  background: var(--selected); color: var(--teal);
  font-family: var(--font-brand); font-weight: 500;
  border-radius: var(--r-sm); overflow: hidden; flex-shrink: 0; user-select: none;
}
.tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tile-sm { width: 44px; height: 44px; font-size: 22px; }
.tile-md { width: 56px; height: 56px; font-size: 28px; }
.tile-lg { width: 100%; aspect-ratio: 5 / 3; font-size: 64px; border-radius: var(--r-md); }

.avatar {
  width: 28px; height: 28px; border-radius: 50%;
  display: grid; place-items: center; flex-shrink: 0;
  background: var(--selected); color: var(--teal);
  font-size: 11px; font-weight: 600;
}

/* --- natural labels --- */
.label { font-size: 11.5px; font-weight: 500; padding: 3px 9px; border-radius: 100px; white-space: nowrap; }
.label-staple { background: var(--selected); color: var(--teal); }
.label-repeat { background: var(--positive-soft); color: var(--positive); }
.label-mixed { background: var(--bg); color: var(--muted); border: 1px solid var(--border); }
.label-occasion { background: var(--bg); color: var(--teal); border: 1px solid var(--selected); }
.label-retired { background: var(--danger-soft); color: var(--danger); }

/* --- meal row --- */
.mrow {
  display: grid;
  grid-template-columns: 30px 44px minmax(0, 1fr) auto;
  gap: 12px; align-items: center; width: 100%;
  padding: 10px var(--s2);
  background: none; border: none; text-align: left; cursor: pointer;
  border-bottom: 1px solid var(--border);
  transition: background .15s;
}
.mrow:hover { background: var(--card); }
.mrow.fresh { background: var(--selected); }
@media (min-width: 800px) { .mrow { padding-left: var(--s1); padding-right: var(--s1); border-radius: var(--r-sm); } }

.mrow .rank { font-size: 17px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; text-align: center; }
.mrow.top3 .rank { color: var(--teal); }
.mrow .name { font-size: 14.5px; font-weight: 500; line-height: 1.3; overflow-wrap: anywhere; }
.mrow .meta2 { font-size: 12px; color: var(--muted); margin-top: 2px; display: flex; flex-wrap: wrap; gap: 4px 8px; }
.mrow .rowlabel { justify-self: end; }

.shead {
  display: flex; align-items: baseline; justify-content: space-between; gap: var(--s2);
  padding: var(--s3) var(--s2) var(--s1);
}
@media (min-width: 800px) { .shead { padding-left: 0; padding-right: 0; } }
.shead h2 { font-size: 16px; font-weight: 600; letter-spacing: -.01em; margin: 0; }
.shead .sub { font-size: 12px; color: var(--muted); }

/* --- Tonight rec cards --- */
.recwrap { display: flex; flex-direction: column; gap: var(--s2); padding: var(--s1) var(--s2); }
@media (min-width: 800px) { .recwrap { padding-left: 0; padding-right: 0; } }

.rec { padding: var(--s2); display: flex; flex-direction: column; gap: 12px; }
.rec .rhead { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); }
.rec .rkind { font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--teal); }
.rec .rbody { display: flex; gap: 14px; align-items: center; }
.rec .rname { font-size: 17px; font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
.rec .rsrc { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.rec .why { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px; }
.rec .why li { font-size: 12px; color: var(--muted); background: var(--bg); border: 1px solid var(--border); border-radius: 100px; padding: 3px 10px; }
.rec .ractions { display: flex; gap: var(--s1); }

/* --- feedback card --- */
.fbcard { margin: var(--s1) var(--s2) 0; padding: 14px var(--s2); display: flex; align-items: center; gap: var(--s2); justify-content: space-between; flex-wrap: wrap; }
@media (min-width: 800px) { .fbcard { margin-left: 0; margin-right: 0; } }
.fbcard p { margin: 0; font-size: 13.5px; }
.fbcard .fbb { display: flex; gap: var(--s1); }

/* --- onboarding --- */
.onb { padding: var(--s4) var(--s2); max-width: 520px; margin: 0 auto; }
.onb .obrand { font-size: 44px; display: block; }
.onb .promise { font-family: var(--font-brand); font-style: italic; font-size: 19px; color: var(--muted); line-height: 1.35; margin: 4px 0 var(--s3); }
.onb h2 { font-size: 21px; font-weight: 600; letter-spacing: -.015em; margin: 0 0 6px; }
.onb .lede { font-size: 13.5px; color: var(--muted); margin: 0 0 var(--s2); }
.onb .steps { font-size: 12px; color: var(--muted); letter-spacing: .05em; text-transform: uppercase; font-weight: 600; margin-bottom: var(--s1); }
.onb .addedlist { display: flex; flex-direction: column; gap: 6px; margin: var(--s2) 0; }
.onb .addedlist .ai { display: flex; justify-content: space-between; align-items: center; padding: 9px 14px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; font-size: 14px; }

/* ================================================================ LOG FLOW */

.flow { padding: var(--s3) var(--s2); max-width: 560px; }
@media (min-width: 800px) { .flow { padding-left: 0; padding-right: 0; } }

.flow .step { font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: var(--s1); }
.flow h2 { font-size: 22px; font-weight: 600; letter-spacing: -.015em; line-height: 1.2; margin: 0 0 6px; overflow-wrap: anywhere; }
.flow .lede { font-size: 13.5px; color: var(--muted); margin: 0 0 var(--s3); }

.field {
  width: 100%; font-family: var(--font-ui); font-size: 15px; color: var(--ink);
  background: var(--card); border: 1px solid var(--border); border-radius: 10px;
  padding: 12px 14px;
}
.field::placeholder { color: var(--muted); }
.field:focus { outline: none; border-color: var(--teal); }
textarea.field { resize: vertical; min-height: 56px; }

.fgroup { margin-bottom: var(--s2); }
.fgroup > label { display: block; font-size: 12.5px; font-weight: 500; color: var(--muted); margin-bottom: 6px; }
.fgroup .chiprow { padding: 0; }

/* search-first log: existing meal hits */
.hitlist { display: flex; flex-direction: column; gap: 6px; margin-top: var(--s1); }
.hit {
  display: grid; grid-template-columns: 44px minmax(0,1fr) auto; gap: 12px; align-items: center;
  padding: 9px 12px; text-align: left;
  background: var(--card); border: 1px solid var(--border); border-radius: 10px; cursor: pointer;
  transition: border-color .15s;
}
.hit:hover { border-color: var(--teal); }
.hit .hn { font-size: 14px; font-weight: 500; overflow-wrap: anywhere; }
.hit .hm { font-size: 11.5px; color: var(--muted); }
.hit .htag { font-size: 11px; color: var(--teal); font-weight: 500; white-space: nowrap; }

details.moredetails { margin: var(--s2) 0; }
details.moredetails summary { font-size: 13px; color: var(--muted); cursor: pointer; font-weight: 500; }
details.moredetails > div { padding-top: var(--s2); }

.photobtn {
  display: flex; align-items: center; gap: 10px;
  width: 100%; padding: 12px 14px;
  background: var(--card); border: 1px dashed var(--border); border-radius: 10px;
  color: var(--muted); font-size: 13.5px; cursor: pointer;
  transition: border-color .15s, color .15s;
}
.photobtn:hover { border-color: var(--teal); color: var(--teal); }
.photobtn img { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; }

.tiers { display: flex; flex-direction: column; gap: var(--s1); }
.tiers.horiz { flex-direction: row; }
.tiers.horiz .tierbtn { flex: 1; flex-direction: column; align-items: flex-start; gap: 2px; padding: 12px 14px; }
.tierbtn {
  display: flex; align-items: center; justify-content: space-between; gap: var(--s2);
  padding: 15px var(--s2); text-align: left;
  background: var(--card); border: 1px solid var(--border); border-radius: var(--r-md);
  cursor: pointer;
  transition: border-color .15s, background .15s;
}
.tierbtn:hover { border-color: var(--teal); }
.tierbtn[aria-pressed="true"] { border-color: var(--teal); background: var(--selected); }
.tierbtn strong { display: block; font-size: 15px; font-weight: 600; }
.tierbtn span.d { font-size: 12px; color: var(--muted); }

/* compare */
.duelwrap { display: flex; flex-direction: column; gap: var(--s1); }
.duel {
  display: flex; flex-direction: column; text-align: left;
  background: var(--card); border: 1px solid var(--border); border-radius: var(--r-md);
  overflow: hidden; cursor: pointer; padding: 0;
  transition: border-color .15s, transform .15s;
}
.duel:hover { border-color: var(--teal); }
.duel:active { transform: scale(.99); }
.duel .tile-lg { border-radius: 0; aspect-ratio: 7 / 3; font-size: 48px; }
.duel .dinfo { padding: 12px var(--s2) 14px; }
.duel .dlabel { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
.duel .dname { font-size: 16px; font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
.duel .dctx { font-size: 12.5px; color: var(--muted); margin-top: 3px; }

.duel-or { text-align: center; font-family: var(--font-brand); font-style: italic; font-size: 16px; color: var(--muted); padding: 2px 0; }
.duel-alts { display: flex; gap: var(--s1); justify-content: center; margin-top: var(--s2); }

/* reveal / confirm */
.reveal { text-align: center; padding: var(--s4) var(--s2); max-width: 480px; margin: 0 auto; }
.reveal .headline { font-family: var(--font-brand); font-size: 34px; font-weight: 500; line-height: 1.1; color: var(--teal); }
.reveal .dn { font-size: 18px; font-weight: 600; margin: 10px 0 2px; overflow-wrap: anywhere; }
.reveal .pl { font-size: 13px; color: var(--muted); margin-bottom: var(--s3); }
.reveal .streakline { display: inline-block; font-size: 12px; font-weight: 500; color: var(--positive); background: var(--positive-soft); border-radius: 100px; padding: 5px 13px; margin-bottom: var(--s3); }

.reactblock { text-align: left; margin: 0 0 var(--s3); }
.reactblock h3 { font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 0 0 var(--s1); }
.reactrow { display: flex; align-items: center; justify-content: space-between; gap: var(--s1); padding: 8px 0; border-bottom: 1px solid var(--border); }
.reactrow .rn { font-size: 14px; font-weight: 500; }
.seg { display: flex; gap: 4px; }
.seg button {
  font-size: 12px; font-weight: 500; padding: 6px 10px; border-radius: 100px;
  background: var(--card); border: 1px solid var(--border); color: var(--muted); cursor: pointer;
  transition: background .15s, color .15s, border-color .15s;
}
.seg button[aria-pressed="true"].s-loved { background: var(--positive-soft); border-color: var(--positive); color: var(--positive); }
.seg button[aria-pressed="true"].s-fine { background: var(--selected); border-color: var(--teal); color: var(--teal); }
.seg button[aria-pressed="true"].s-never { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }

.nbs { text-align: left; border-top: 1px solid var(--border); margin-bottom: var(--s3); }
.nb { display: flex; justify-content: space-between; gap: var(--s2); padding: 10px 4px; font-size: 13.5px; border-bottom: 1px solid var(--border); }
.nb.isnew { background: var(--selected); font-weight: 600; padding-left: 10px; padding-right: 10px; border-radius: 6px; }
.nb .n { color: var(--muted); }

/* ================================================================ DETAIL */

.detail {
  position: fixed; inset: 0; z-index: 70;
  background: var(--bg);
  overflow-y: auto;
  transform: translateY(8px); opacity: 0; pointer-events: none;
  transition: transform .2s, opacity .2s;
}
.detail.on { transform: none; opacity: 1; pointer-events: auto; }

.detail-in { max-width: 664px; margin: 0 auto; padding: calc(10px + var(--sat)) var(--s2) calc(40px + var(--sab)); }
.detail-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--s2); }

.detail h1 { font-size: 24px; font-weight: 600; letter-spacing: -.02em; line-height: 1.2; margin: 14px 0 4px; overflow-wrap: anywhere; }
.detail .dsub { font-size: 13px; color: var(--muted); margin-bottom: var(--s2); }
.detail .dsub a { color: var(--teal); }

.dstats { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s1); margin: var(--s2) 0; }
.dstat { padding: 12px 8px; text-align: center; }
.dstat .k { font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--teal); }
.dstat .l { font-size: 11px; color: var(--muted); margin-top: 2px; }

.dsection { margin-top: var(--s3); }
.dsection h3 { font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 0 0 var(--s1); }

.hist { border-top: 1px solid var(--border); margin: 0; padding: 0; }
.hist li { list-style: none; display: flex; justify-content: space-between; gap: var(--s2); padding: 9px 2px; font-size: 13px; border-bottom: 1px solid var(--border); color: var(--muted); }
.hist li b { color: var(--ink); font-weight: 500; }

.dactions { display: flex; gap: var(--s1); margin-top: var(--s3); position: sticky; bottom: calc(12px + var(--sab)); }

/* ================================================================ SAVED + HOUSEHOLD */

.plainlist { border-top: 1px solid var(--border); margin: 0 var(--s2); }
@media (min-width: 800px) { .plainlist { margin-left: 0; margin-right: 0; } }
.plainlist .prow { display: flex; justify-content: space-between; align-items: center; gap: var(--s2); padding: 11px 2px; font-size: 14px; border-bottom: 1px solid var(--border); }
.plainlist .prow .pn { font-weight: 500; overflow-wrap: anywhere; }
.plainlist .prow .pm { font-size: 12px; color: var(--muted); }
.plainlist .prow .pa { display: flex; gap: 6px; flex-shrink: 0; }

.hh-member { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.hh-member .mn { font-size: 14.5px; font-weight: 500; flex: 1; }

.empty { text-align: center; padding: 48px 32px; color: var(--muted); }
.empty .brand { font-size: 24px; color: var(--ink); display: block; margin-bottom: 6px; }
.empty p { font-size: 13.5px; margin: 0 0 var(--s2); }

.toast {
  position: fixed; left: 50%; bottom: calc(96px + var(--sab)); z-index: 90;
  transform: translateX(-50%) translateY(8px);
  background: var(--ink); color: var(--bg);
  font-size: 13px; font-weight: 500;
  padding: 10px 16px; border-radius: 100px;
  opacity: 0; pointer-events: none;
  transition: opacity .18s, transform .18s;
  max-width: 90vw; text-align: center;
}
.toast.on { opacity: 1; transform: translateX(-50%); }

/* skeleton */
.skel { pointer-events: none; }
.skel .sk {
  background: linear-gradient(90deg, var(--border) 25%, color-mix(in srgb, var(--border) 45%, var(--card)) 50%, var(--border) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.1s linear infinite;
  border-radius: 6px;
}
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
